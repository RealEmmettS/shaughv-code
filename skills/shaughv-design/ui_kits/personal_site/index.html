<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SHAUGHV — UI Kit · Personal Site</title>
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <style>
    :root {
      /* Override system tokens with brutalist dark for this kit */
      --bg: #090909;
      --bg-raised: #0e0e0e;
      --fg: #E6E6E6;
      --fg-muted: rgba(230, 230, 230, 0.8);
      --fg-soft: rgba(230, 230, 230, 0.6);
      --fg-faint: rgba(230, 230, 230, 0.25);
      --accent: #FF5E1A;
      --warm: #C2A83E;
      --border-hairline: rgba(230, 230, 230, 0.2);
      --border-strong: #E6E6E6;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: #090909;
      color: #E6E6E6;
      font-family: "Makira", system-ui, sans-serif;
      overflow-x: hidden;
    }
    body { cursor: none; }
    @media (pointer: coarse) { body { cursor: auto; } }
    a, button, [role="button"], input, textarea, select { cursor: none; }
    h1, h2, h3, h4, h5, h6 { font-family: "Makira", system-ui, sans-serif; }
    ::selection { background: #FF5E1A; color: #E6E6E6; }

    @keyframes shv-works-ticker {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* Responsive collapse — single column under 900px */
    @media (max-width: 900px) {
      .shv-grid,
      .shv-footer-grid,
      .shv-contact-grid,
      .shv-works-hero-grid { grid-template-columns: 1fr !important; }
      .shv-skills-grid { grid-template-columns: repeat(2, 1fr) !important; }
      .shv-nav-desktop { display: none !important; }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script src="data.js"></script>
  <script type="text/babel" src="DotMatrix.jsx"></script>
  <script type="text/babel" src="Navbar.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="About.jsx"></script>
  <script type="text/babel" src="Projects.jsx"></script>
  <script type="text/babel" src="Skills.jsx"></script>
  <script type="text/babel" src="Contact.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel" src="WorkTile.jsx"></script>
  <script type="text/babel" src="Works.jsx"></script>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [route, setRoute] = useState("home"); // "home" | "works"

      return (
        <div data-screen-label={route === "home" ? "01 Home" : "02 The Index"}>
          <window.DotMatrix />
          <window.CustomCursor />
          <window.Navbar route={route} setRoute={setRoute} />
          {route === "home" ? (
            <>
              <window.Hero />
              <window.About />
              <window.Projects setRoute={setRoute} />
              <window.Skills />
              <window.Contact />
              <window.Footer />
            </>
          ) : (
            <>
              <window.Works setRoute={setRoute} />
              <window.Footer />
            </>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
