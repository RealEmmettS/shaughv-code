<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card-base.css"></head>
<body class="card" style="min-height:220px">
  <div class="section-label">Mono · IBM Plex Mono · metadata + labels</div>
  <div class="col" style="gap:14px">
    <div style="font-family:var(--font-mono);font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--fg-soft)">Index 001 &mdash; 027</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <span style="font-family:var(--font-mono);font-size:11px;border:1px solid var(--border-strong);padding:4px 10px;border-radius:9999px;text-transform:uppercase;letter-spacing:0.05em">Next.js, React</span>
      <span style="font-family:var(--font-mono);font-size:11px;border:1px solid var(--border-strong);padding:4px 10px;border-radius:9999px;text-transform:uppercase;letter-spacing:0.05em">TypeScript</span>
      <span style="font-family:var(--font-mono);font-size:11px;border:1px solid var(--accent);background:var(--accent);color:var(--sv-cream-100);padding:4px 10px;border-radius:9999px;text-transform:uppercase;letter-spacing:0.05em">iOS</span>
    </div>
    <code style="font-family:var(--font-mono);font-size:13px;background:var(--sv-cream-300);color:var(--sv-olive-dark);padding:8px 10px;border-radius:4px;display:inline-block">const accent = "#5B8A5B" // sage</code>
  </div>
  <div class="label-row" style="margin-top:12px"><span>IBM Plex Mono 400 / 500</span><span>0.18em tracking</span></div>
</body></html>
