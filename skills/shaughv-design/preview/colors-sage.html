<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card-base.css"></head>
<body class="card" style="min-height:220px">
  <div class="section-label">Sage — primary accent / action</div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
    <div><div class="swatch on-dark" style="background:#7BA37B">muted</div><div class="label-row"><span>#7BA37B</span></div></div>
    <div><div class="swatch on-dark" style="background:#6B9A6B">light</div><div class="label-row"><span>#6B9A6B</span></div></div>
    <div><div class="swatch on-dark" style="background:#5B8A5B">DEFAULT</div><div class="label-row"><span>#5B8A5B</span></div></div>
    <div><div class="swatch on-dark" style="background:#4A7A4A">dark</div><div class="label-row"><span>#4A7A4A</span></div></div>
  </div>
  <div style="font-family:var(--font-sans);font-size:12px;color:var(--fg-muted);margin-top:14px">
    Sage is the action color — CTAs, focus rings, active filter chips, selection. <code style="font-family:var(--font-mono);font-size:11px">--accent</code>.
  </div>
</body></html>
