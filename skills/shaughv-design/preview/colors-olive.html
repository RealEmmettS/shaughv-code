<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card-base.css"></head>
<body class="card" style="min-height:220px">
  <div class="section-label">Olive — primary text / structure</div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
    <div><div class="swatch on-dark" style="background:#6C6456">light</div><div class="label-row"><span>#6C6456</span></div></div>
    <div><div class="swatch on-dark" style="background:#5C5446">DEFAULT</div><div class="label-row"><span>#5C5446</span></div></div>
    <div><div class="swatch on-dark" style="background:#4C4436">dark</div><div class="label-row"><span>#4C4436</span></div></div>
  </div>
  <div style="font-family:var(--font-sans);font-size:12px;color:var(--fg-muted);margin-top:14px">
    Olive is the foreground — body copy, headings, hairlines at 18&ndash;30% opacity. Paired with cream-100 for AA contrast at body sizes.
  </div>
</body></html>
