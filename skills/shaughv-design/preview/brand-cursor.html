<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared cursor specimen</title>
  <link rel="stylesheet" href="_card-base.css">
  <link rel="stylesheet" href="https://cdn.shaughv.com/brand/shaughv/components.css">
  <script defer src="https://cdn.shaughv.com/js/shaughv-cursor.js?v=2026-10-21.4"></script>
  <script defer data-auto src="https://cdn.shaughv.com/js/shaughv-dropdown.js?v=2026-10-21.2"></script>
  <style>
    body.card { width: 100%; max-width: 700px; }
    label, input, a { display: block; margin-block: 12px; }
    input { padding: 8px; max-width: 100%; }
    a { width: fit-content; color: inherit; }
  </style>
</head>
<body class="card">
  <shaughv-cursor color="sage"></shaughv-cursor>
  <label for="sample">Try the typing caret</label>
  <input id="sample" type="text" autocomplete="off">
  <a href="https://cdn.shaughv.com/cursor">Explore cursor states on the CDN</a>
</body>
</html>
