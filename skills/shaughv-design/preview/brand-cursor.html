<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card-base.css"></head>
<body class="card" style="min-height:200px">
  <div class="section-label">Custom cursor · desktop only · sage dot</div>
  <div style="height:128px;background:var(--bg-raised);border:1px solid var(--border-hairline);position:relative;margin-top:6px;overflow:hidden">
    <!-- target text -->
    <div style="position:absolute;left:24px;top:36px;font-family:var(--font-heading);font-weight:700;font-size:32px;text-transform:uppercase;letter-spacing:-0.02em;color:var(--fg)">VIEW WORK <span style="color:var(--accent)">→</span></div>
    <!-- cursor dot default -->
    <div style="position:absolute;left:60%;top:30%;width:14px;height:14px;background:var(--accent);border-radius:9999px;mix-blend-mode:multiply"></div>
    <!-- cursor dot expanded over CTA -->
    <div style="position:absolute;left:32%;top:60%;width:36px;height:36px;background:var(--accent);border-radius:9999px;mix-blend-mode:multiply;opacity:0.85"></div>
    <div style="position:absolute;left:30%;top:60%;font-family:var(--font-mono);font-size:9px;color:var(--fg-soft);letter-spacing:0.12em;text-transform:uppercase;transform:translate(-50%,40px)">scale 2.5×</div>
  </div>
  <div style="font-family:var(--font-sans);font-size:12px;color:var(--fg-muted);margin-top:14px">
    Spring physics (mass 0.4, stiffness 900, damping 28). Scales 2.5× over <code style="font-family:var(--font-mono);font-size:11px">[data-magnetic]</code> targets. Hidden on coarse pointers.
  </div>
</body></html>
