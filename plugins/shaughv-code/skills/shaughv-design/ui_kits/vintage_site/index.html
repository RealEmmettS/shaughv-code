<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SHAUGHV — UI Kit · Vintage Edition</title>
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <style>
    html, body { margin: 0; padding: 0; }
    body { font-family: "Makira", "Inter", system-ui, sans-serif; }
    ::selection { background: var(--sv-sage); color: var(--sv-cream-100); }

    @media (max-width: 900px) {
      .shv-grid,
      .shv-footer-grid { grid-template-columns: 1fr !important; }
      .shv-skills-grid { grid-template-columns: repeat(2, 1fr) !important; }
      .shv-nav-desktop { display: none !important; }
      .shv-vintage-decor { display: none; }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Canonical SHAUGHV brand mark loader (auto-mounts on <shaughv-mark> / [data-shaughv-mark]) -->
  <script src="../../assets/animated-brand-mark.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="BauhausPrimitives.jsx"></script>
  <script type="text/babel" src="Navigation.jsx"></script>
  <script type="text/babel" src="HeroSection.jsx"></script>
  <script type="text/babel" src="AboutSection.jsx"></script>
  <script type="text/babel" src="ProjectsSection.jsx"></script>
  <script type="text/babel" src="SkillsSection.jsx"></script>
  <script type="text/babel" src="ContactSection.jsx"></script>
  <script type="text/babel" src="FooterSection.jsx"></script>

  <script type="text/babel">
    function App() {
      return (
        <div data-screen-label="01 Vintage Home">
          {/* Sage dot-matrix wash -- the signature codebase background pattern */}
          <window.DotMatrix />
          <window.Navigation />
          <window.HeroSection />
          <window.AboutSection />
          <window.ProjectsSection />
          <window.SkillsSection />
          <window.ContactSection />
          <window.FooterSection />
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
