<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card-base.css"></head>
<body class="card" style="min-height:220px">
  <div class="section-label">Cream — surfaces & background</div>
  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px">
    <div><div class="swatch" style="background:#FDFDFB">50</div><div class="label-row"><span>#FDFDFB</span></div></div>
    <div><div class="swatch" style="background:#FAFAF8">100</div><div class="label-row"><span>#FAFAF8</span></div></div>
    <div><div class="swatch" style="background:#F5F5F0">200</div><div class="label-row"><span>#F5F5F0</span></div></div>
    <div><div class="swatch" style="background:#EEEEE8">300</div><div class="label-row"><span>#EEEEE8</span></div></div>
    <div><div class="swatch" style="background:#E5E5DF">400</div><div class="label-row"><span>#E5E5DF</span></div></div>
  </div>
  <div style="font-family:var(--font-sans);font-size:12px;color:var(--fg-muted);margin-top:14px">
    Page background uses a cream-200 → cream-100 → cream-200 vertical gradient. Cards sit on cream-100; wells use cream-300.
  </div>
</body></html>
