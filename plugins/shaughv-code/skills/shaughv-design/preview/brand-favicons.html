<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card-base.css"></head>
<body class="card" style="min-height:220px">
  <div class="section-label">Favicon set · mustache + glasses icon mark</div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:6px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
      <div style="width:100px;height:100px;background:var(--bg-raised);border:1px solid var(--border-hairline);display:flex;align-items:center;justify-content:center">
        <img src="../assets/SHAUGHV-Favicon-Light.svg" style="width:64%;height:64%;object-fit:contain" alt="favicon light"/>
      </div>
      <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--fg-soft)">Light</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
      <div style="width:100px;height:100px;background:var(--bg-raised);border:1px solid var(--border-hairline);display:flex;align-items:center;justify-content:center">
        <img src="../assets/SHAUGHV-Favicon-Light-Alt.svg" style="width:64%;height:64%;object-fit:contain" alt="favicon light alt"/>
      </div>
      <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--fg-soft)">Light · Alt</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
      <div style="width:100px;height:100px;background:#0B0B0B;border:1px solid var(--border-hairline);display:flex;align-items:center;justify-content:center">
        <img src="../assets/SHAUGHV-Favicon-Dark.svg" style="width:64%;height:64%;object-fit:contain" alt="favicon dark"/>
      </div>
      <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--fg-soft)">Dark</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
      <div style="width:100px;height:100px;background:#0B0B0B;border:1px solid var(--border-hairline);display:flex;align-items:center;justify-content:center">
        <img src="../assets/SHAUGHV-Favicon-Dark-Alt.svg" style="width:64%;height:64%;object-fit:contain" alt="favicon dark alt"/>
      </div>
      <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--fg-soft)">Dark · Alt</div>
    </div>
  </div>
</body></html>
