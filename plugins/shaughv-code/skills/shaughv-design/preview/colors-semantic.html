<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card-base.css"></head>
<body class="card" style="min-height:240px">
  <div class="section-label">Semantic tokens — referenced by components</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-family:var(--font-mono);font-size:11px">
    <div style="display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--border-hairline);border-radius:4px">
      <span style="width:28px;height:28px;background:#F5F5F0;border:1px solid var(--border-hairline);border-radius:2px"></span>
      <div><div style="color:var(--fg)">--bg</div><div style="color:var(--fg-soft)">cream-200</div></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--border-hairline);border-radius:4px">
      <span style="width:28px;height:28px;background:#FAFAF8;border:1px solid var(--border-hairline);border-radius:2px"></span>
      <div><div style="color:var(--fg)">--bg-raised</div><div style="color:var(--fg-soft)">cream-100</div></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--border-hairline);border-radius:4px">
      <span style="width:28px;height:28px;background:#5C5446;border-radius:2px"></span>
      <div><div style="color:var(--fg)">--fg</div><div style="color:var(--fg-soft)">olive</div></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--border-hairline);border-radius:4px">
      <span style="width:28px;height:28px;background:#5B8A5B;border-radius:2px"></span>
      <div><div style="color:var(--fg)">--accent</div><div style="color:var(--fg-soft)">sage</div></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--border-hairline);border-radius:4px">
      <span style="width:28px;height:28px;background:#C4A876;border-radius:2px"></span>
      <div><div style="color:var(--fg)">--warm</div><div style="color:var(--fg-soft)">bamboo</div></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--border-hairline);border-radius:4px">
      <span style="width:28px;height:28px;background:#BE3A34;border-radius:2px"></span>
      <div><div style="color:var(--fg)">--sv-bauhaus-red</div><div style="color:var(--fg-soft)">accent · sparing</div></div>
    </div>
  </div>
</body></html>
