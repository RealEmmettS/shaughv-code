<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card-base.css"></head>
<body class="card" style="min-height:200px">
  <div class="section-label">Section rhythm · how a section pads</div>
  <div style="border:1px dashed var(--border-hairline);position:relative;padding:48px 28px;background:var(--bg-raised)">
    <div style="position:absolute;left:6px;top:6px;font-family:var(--font-mono);font-size:9px;letter-spacing:0.15em;color:var(--fg-soft);text-transform:uppercase">py: clamp(4rem,9vw,8rem)</div>
    <div style="display:grid;grid-template-columns:repeat(12,1fr);gap:8px">
      <div style="grid-column:span 1;text-align:right;font-family:var(--font-mono);font-size:10px;color:var(--fg-soft)">001</div>
      <div style="grid-column:span 4">
        <div style="font-family:var(--font-heading);font-weight:700;font-size:20px;text-transform:uppercase;line-height:1.05">QubeTX</div>
        <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-soft);letter-spacing:0.12em;text-transform:uppercase;margin-top:4px">Developer Tools — 2026</div>
      </div>
      <div style="grid-column:span 6;background:var(--bg-sunken);height:48px;border:1px solid var(--border-hairline)"></div>
      <div style="grid-column:span 1;display:flex;justify-content:flex-end;align-items:center">
        <div style="width:28px;height:28px;border:1px solid var(--border-strong);border-radius:9999px"></div>
      </div>
    </div>
  </div>
  <div class="label-row" style="margin-top:10px">
    <span>12-col grid · 1 / 4 / 6 / 1</span>
    <span>max-w 1920 · px clamp(1.5rem,5vw,3rem)</span>
  </div>
</body></html>
