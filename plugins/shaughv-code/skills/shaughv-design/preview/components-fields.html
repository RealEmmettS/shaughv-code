<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card-base.css">
<style>
  .field { font-family:var(--font-sans); font-size:14px; width:100%; box-sizing:border-box; background:transparent; border:1px solid var(--border-strong); padding:12px 14px; color:var(--fg); transition:border var(--dur-base) ease; }
  .field:focus { outline:none; border-color:var(--accent); }
  .field::placeholder { color:var(--fg-soft); }
  .field-label { font-family:var(--font-mono); font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--fg-soft); margin-bottom:6px; display:block; }
  .search-wrap { position:relative; }
  .search-wrap svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--fg-soft); }
  .search-wrap .field { padding-left:36px; }
</style>
</head>
<body class="card" style="min-height:260px">
  <div class="section-label">Form fields · text + search · single-line</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:6px">
    <div>
      <label class="field-label">Email</label>
      <input class="field" placeholder="hey@emmetts.dev" />
    </div>
    <div>
      <label class="field-label">Project</label>
      <input class="field" placeholder="Tell me about it…" value="Marketing site" />
    </div>
    <div style="grid-column:1 / -1">
      <label class="field-label">Search</label>
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.35-4.35"></path></svg>
        <input class="field" placeholder="Search works…" />
      </div>
    </div>
  </div>
  <div style="font-family:var(--font-sans);font-size:12px;color:var(--fg-muted);margin-top:14px">
    Square borders. Focus ring is olive → sage. No background fill. Labels above, mono, all-caps.
  </div>
</body></html>
