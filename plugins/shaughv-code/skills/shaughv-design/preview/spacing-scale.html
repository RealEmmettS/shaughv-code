<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card-base.css"></head>
<body class="card" style="min-height:220px">
  <div class="section-label">Spacing scale · rem-based, 4px increments</div>
  <div style="display:flex;align-items:flex-end;gap:10px;height:88px">
    <div style="flex:none;width:4px;height:4px;background:var(--accent)"></div>
    <div style="flex:none;width:8px;height:8px;background:var(--accent)"></div>
    <div style="flex:none;width:12px;height:12px;background:var(--accent)"></div>
    <div style="flex:none;width:16px;height:16px;background:var(--accent)"></div>
    <div style="flex:none;width:24px;height:24px;background:var(--accent)"></div>
    <div style="flex:none;width:32px;height:32px;background:var(--accent)"></div>
    <div style="flex:none;width:48px;height:48px;background:var(--accent)"></div>
    <div style="flex:none;width:64px;height:64px;background:var(--accent)"></div>
  </div>
  <div style="display:flex;gap:10px;font-family:var(--font-mono);font-size:10px;color:var(--fg-soft);margin-top:8px">
    <span style="width:4px">1</span><span style="width:8px">2</span><span style="width:12px">3</span><span style="width:16px">4</span><span style="width:24px">5</span><span style="width:32px">6</span><span style="width:48px">8</span><span style="width:64px">10</span>
  </div>
  <div class="label-row" style="margin-top:14px">
    <span>--space-1 (4px) → --space-10 (64px)</span>
    <span>Section py: clamp(4rem,9vw,8rem)</span>
  </div>
</body></html>
