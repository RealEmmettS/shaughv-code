# Repo-local Codex MCP fallback.
#
# Codex sessions run inside this repo register these MCP servers even before the
# plugin is installed from the marketplace. They mirror the bundled servers in
# the repo-root .mcp.json (the Claude-shape source of truth) in Codex's native
# TOML config shape. Keep these in sync with .mcp.json by hand — the two formats
# differ (JSON map vs TOML tables), so build-codex-plugin.ps1 does not generate
# this file.

[mcp_servers.remotion-documentation]
command = "npx"
args = ["@remotion/mcp@latest"]

[mcp_servers.craft-docs]
url = "https://mcp.craft.do/links/LKUYYz65h6s/mcp"

[mcp_servers.shaughv-health]
url = "https://health.emmetts.dev/api/mcp"
