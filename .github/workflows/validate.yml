name: Validate

# Keeps the tracked Codex package (plugins/shaughv-code/) permanently in sync with
# root content. Runs on every PR into `main` and on every push to `main`: if the
# package has drifted from root skills/ / .mcp.json / .codex-plugin/plugin.json, if a
# manifest is malformed, or if the version is out of lockstep across the two plugin
# manifests + CHANGELOG, the run fails. (`.claude-plugin/marketplace.json` carries no
# version: Claude Code always prefers the one in plugin.json, so declaring it in both
# only creates a way for them to drift.) Regenerate locally with:
#   pwsh ./build-codex-plugin.ps1
#
# This is the shaughv-code equivalent of the work theia-tools plugin's validate gate.
# The Codex package is committed by hand (per AGENTS.md); CI does not regenerate or
# commit anything — it only enforces that the committed package never falls out of sync.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest # pwsh + .NET parity with build-codex-plugin.ps1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON manifests
        shell: pwsh
        run: |
          $files = @(
            '.claude-plugin/marketplace.json',
            '.claude-plugin/plugin.json',
            '.mcp.json',
            '.agents/plugins/marketplace.json',
            '.codex-plugin/plugin.json',
            'plugins/shaughv-code/.codex-plugin/plugin.json',
            'plugins/shaughv-code/.mcp.json'
          )
          foreach ($f in $files) {
            Get-Content $f -Raw | ConvertFrom-Json | Out-Null
            Write-Host "ok: $f"
          }

      - name: Validate tracked Codex plugin package (must be in sync + path-safe)
        # Rebuilds plugins/shaughv-code/ into a temp dir and SHA-compares it to the
        # committed copy. Fails if it drifted from root content, if the version is out
        # of lockstep, or if a packaged path exceeds the Windows clone limit.
        # Regenerate with: pwsh ./build-codex-plugin.ps1
        shell: pwsh
        run: ./build-codex-plugin.ps1 -Check

      - name: Version lockstep (2 plugin manifests + CHANGELOG agree)
        # The marketplace entry deliberately declares no version — Claude Code always
        # uses plugin.json's, so a version there could silently mask a stale manifest.
        # This step also fails if one is reintroduced, to keep that decision enforced.
        shell: pwsh
        run: |
          $codex  = (Get-Content .codex-plugin/plugin.json -Raw | ConvertFrom-Json).version
          $claude = (Get-Content .claude-plugin/plugin.json -Raw | ConvertFrom-Json).version
          $market = (Get-Content .claude-plugin/marketplace.json -Raw | ConvertFrom-Json).plugins[0].version
          $clog   = ([regex]::Match((Get-Content CHANGELOG.md -Raw), '(?m)^##\s*\[(\d+\.\d+\.\d+)\]')).Groups[1].Value
          Write-Host "codex=$codex  claude=$claude  changelog=$clog"
          if ($null -ne $market) {
            Write-Error "MARKETPLACE VERSION REINTRODUCED: .claude-plugin/marketplace.json plugins[0].version = $market. Remove it; .claude-plugin/plugin.json is the single source of truth."
            exit 1
          }
          if (($codex -ne $claude) -or ($codex -ne $clog)) {
            Write-Error "VERSION LOCKSTEP DRIFT: codex=$codex claude=$claude changelog=$clog"
            exit 1
          }
          Write-Host "version lockstep OK ($codex)"

      - name: CODEX_PROJECT.md freshness (stated release + package counts are real)
        # CODEX_PROJECT.md silently drifted several releases behind (it still claimed
        # 0.35.0 / 29 skills / 461 files at 1.2.0) because nothing checked it. These
        # three numbers are the parts that rot, so they are now asserted against the
        # manifests and the generated package. Everything else in that file is prose
        # or a regenerated tree, kept current via the release workflow it documents.
        shell: pwsh
        run: |
          $doc     = Get-Content CODEX_PROJECT.md -Raw
          $version = (Get-Content .codex-plugin/plugin.json -Raw | ConvertFrom-Json).version
          $skills  = (Get-ChildItem -LiteralPath plugins/shaughv-code/skills -Directory).Count
          $files   = (Get-ChildItem -LiteralPath plugins/shaughv-code -Recurse -File -Force).Count

          $mRel = [regex]::Match($doc, '(?m)^- \*\*Current release:\*\* (\d+\.\d+\.\d+)')
          $mCnt = [regex]::Match($doc, 'contains (\d+) skill directories and (\d+) files')
          if (-not $mRel.Success) {
            Write-Error "CODEX_PROJECT.md: could not find the '- **Current release:** X.Y.Z' line. Do not reword it; CI parses it."
            exit 1
          }
          if (-not $mCnt.Success) {
            Write-Error "CODEX_PROJECT.md: could not find the 'contains N skill directories and M files' phrase. Do not reword it; CI parses it."
            exit 1
          }

          $docRel    = $mRel.Groups[1].Value
          $docSkills = [int]$mCnt.Groups[1].Value
          $docFiles  = [int]$mCnt.Groups[2].Value
          Write-Host "doc: release=$docRel skills=$docSkills files=$docFiles"
          Write-Host "real: release=$version skills=$skills files=$files"

          $problems = @()
          if ($docRel    -ne $version) { $problems += "release: doc says $docRel, manifests say $version" }
          if ($docSkills -ne $skills)  { $problems += "skill directories: doc says $docSkills, package has $skills" }
          if ($docFiles  -ne $files)   { $problems += "files: doc says $docFiles, package has $files" }
          if ($problems.Count -gt 0) {
            Write-Error ("CODEX_PROJECT.md IS STALE:" + [Environment]::NewLine + ($problems -join [Environment]::NewLine) + [Environment]::NewLine + "Update its Project status block in this commit (see the release workflow in that file).")
            exit 1
          }
          Write-Host "CODEX_PROJECT.md freshness OK ($version, $skills skills, $files files)"
